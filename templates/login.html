{% extends 'base.html' %}

{% block title %}Login — Placement Portal{% endblock %}

{% block content %}
<div class="container">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" name="email" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit">Login</button>
    </form>
    <p>
        <a href="{{ url_for('register', role='student') }}" class="btn btn-outline-primary">Register as Student</a>
        |
        <a href="{{ url_for('register', role='company') }}" class="btn btn-outline-primary">Register as Company</a>
    </p>
</div>
{% endblock %}
