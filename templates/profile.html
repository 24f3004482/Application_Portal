{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container">
    <h2>Student profile</h2>
    <p><a href="{{ url_for('student_dashboard') }}">Back to dashboard</a></p>

    <form method="post" action="{{ url_for('student_profile') }}" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input id="name" type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" value="{{ current_user.email }}" disabled>
        </div>
        <div class="mb-3">
            <label for="contact" class="form-label">Phone / contact</label>
            <input id="contact" type="text" name="contact" class="form-control" value="{{ current_user.contact or '' }}">
        </div>
        <div class="mb-3">
            <label for="student_roll" class="form-label">Student roll / ID</label>
            <input id="student_roll" type="text" name="student_roll" class="form-control" value="{{ current_user.student_roll or '' }}">
        </div>
        <div class="mb-3">
            <label for="resume" class="form-label">Resume (PDF or Word — .pdf, .doc, .docx)</label>
            <input id="resume" type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        </div>
        {% if current_user.resume_filename %}
        <p>Current resume file: {{ current_user.resume_filename }}</p>
        {% endif %}
        <button type="submit" class="btn btn-primary">Save profile</button>
    </form>
</div>
{% endblock %}
