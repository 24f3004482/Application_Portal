{% extends 'base.html' %}

{% block title %}Edit Drive{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit placement drive</h2>
    <p><a class="btn btn-outline-primary" href="{{ url_for('company_dashboard') }}">Back to dashboard</a></p>

    <form method="post" action="{{ url_for('company_edit_drive', drive_id=drive.id) }}">
        <div class="mb-3">
            <label for="job_title" class="form-label">Job title</label>
            <input id="job_title" type="text" name="job_title" value="{{ drive.job_title }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="job_description" class="form-label">Job description</label>
            <textarea id="job_description" name="job_description" rows="8" class="form-control" required>{{ drive.job_description }}</textarea>
        </div>
        <div class="mb-3">
            <label for="eligibility" class="form-label">Eligibility criteria</label>
            <input id="eligibility" type="text" name="eligibility" value="{{ drive.eligibility }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="deadline" class="form-label">Application deadline</label>
            <input id="deadline" type="date" name="deadline" value="{{ (drive.deadline or '')[:10] }}" class="form-control" required>
        </div>
        <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
</div>
{% endblock %}
